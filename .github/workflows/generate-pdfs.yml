name: Generate stage PDFs

on:
  push:
    paths:
      - "data/*.json"
      - "scripts/validate_data.py"
      - "scripts/source_quality.py"
      - "scripts/enrich_sources.py"
      - "data/source_versions.json"
      - "config/stages.json"
      - "scripts/export_pdfs.py"
      - "scripts/stages.py"
      - "requirements.txt"
      - ".github/workflows/generate-pdfs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survival-pdf-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich legacy source and stage metadata
        run: python -m scripts.enrich_sources

      - name: Validate publication dataset
        run: python -m scripts.validate_data

      - name: Validate technical knowledge catalogues
        run: python -m scripts.knowledge_validation

      - name: Generate one PDF per stage
        run: python -m scripts.export_pdfs --all

      - name: Generate approved technical knowledge PDFs
        run: python -m scripts.export_knowledge

      - name: Commit generated PDFs if changed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pdf docs/knowledge-pdf
          if git diff --cached --quiet; then
            echo "PDFs are already up to date."
          else
            git commit -m "docs: regenerate stage PDFs from JSON data"
            git push
          fi

name: Test, audit, and validate data (quarantine schema)

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/*.json"
      - "config/*.json"
      - "requirements.txt"
      - ".github/workflows/test.yml"
      - ".github/workflows/approve-candidates.yml"
      - ".github/workflows/review-knowledge.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/*.json"
      - "config/*.json"
      - "requirements.txt"
      - ".github/workflows/test.yml"

permissions:
  contents: read

concurrency:
  group: survival-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enrich legacy source and stage metadata
        run: python -m scripts.enrich_sources

      - name: Run tests
        run: python -m pytest -q

      - name: Validate stored data structure
        run: python -m scripts.validate_data

      - name: Validate technical knowledge catalogues
        run: python -m scripts.knowledge_validation

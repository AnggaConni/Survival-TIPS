name: Collect survival data
on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Maximum source pages to fetch"
        required: false
        default: "8"
      gbif_limit:
        description: "Maximum images per taxon query"
        required: false
        default: "2"
      repair_tips:
        description: "Re-extract flagged tip sources using AI (may use API credits)"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "31 3 * * 1"
permissions:
  contents: write
concurrency:
  group: survival-data-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect sources, AI tips, GBIF images
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.inputs.source_limit || '8' }}
          MAX_GBIF_IMAGES_PER_RUN: ${{ github.event.inputs.gbif_limit || '2' }}
          USER_AGENT: "Survival-TIPS/0.1 (educational research)"
        run: python -m scripts.run_pipeline --limit "$MAX_ARTICLES_PER_RUN" --gbif-limit "$MAX_GBIF_IMAGES_PER_RUN" --ai-limit 5
      - name: Audit tip quality (optional AI repair)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          REPAIR_TIPS: ${{ github.event.inputs.repair_tips || 'false' }}
        run: |
          if [ "$REPAIR_TIPS" = "true" ]; then
            python -m scripts.audit_tips --repair
          else
            python -m scripts.audit_tips
          fi
      - name: Validate JSON
        run: python -m scripts.validate_data
      - name: Test
        run: python -m pytest -q
      - name: Generate separate stage PDFs
        run: python -m scripts.export_pdfs --all
      - name: Commit collected data and PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets docs/pdf
          if git diff --cached --quiet; then echo "No new data or PDFs."; else git commit -m "data: update survival knowledge and stage handbooks"; git push; fi
